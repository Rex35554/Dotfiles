config_version = 16

[backdrop]
blur_intensity = 0.099999997764825821
enabled = false
tint_intensity = 0.0

[bar]
order = [ "default", "bar" ]

    [bar.bar]
    background_opacity = 0.0
    concave_edge_corners = false
    enabled = false
    margin_edge = 4
    margin_ends = 0
    position = "left"
    radius = 2

    [bar.default]
    auto_hide = false
    background_opacity = 0.99999997764825821
    capsule = true
    capsule_padding = 6.0
    center = [ "wallpaper", "clock", "notifications" ]
    compositor_blur = false
    concave_edge_corners = true
    contact_shadow = false
    end = [ "tray", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "session" ]
    font_family = "JetBrains Mono"
    layer = "top"
    margin_ends = 0
    margin_opposite_edge = 0
    padding = 4
    position = "left"
    radius = 0
    radius_bottom_left = 0
    radius_bottom_right = 12
    radius_top_left = 0
    radius_top_right = 12
    reserve_space = true
    shadow = false
    show_on_workspace_switch = false
    start = [ "launcher", "workspaces", "active_window", "media" ]
    thickness = 34

[battery]
warning_threshold = 30

[brightness]
enable_ddcutil = false

[control_center.media]
show_visualizer = true

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "nightlight"

[[control_center.shortcuts]]
type = "notification"

[dock]
concave_edge_corners = false
enabled = false
reserve_space = false
show_dots = false

[hot_corners]
enabled = true

    [hot_corners.top_right]
    action = "window_switcher"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true

[shell]
corner_radius_scale = 0.40000000596046448
font_family = "JetBrains Mono"
niri_overview_type_to_launch_enabled = true
polkit_agent = true
popup_shadows = false
settings_show_advanced = true

    [shell.launcher]
    app_grid = false
    categories = false
    category_icons_only = false
    default_view = "all"
    layout = "full"
    search_position = "bottom"
    sort_by_usage = true
    width = 560

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "auto"
    session_placement = "floating"
    session_position = "top_center"
    shadow = false
    wallpaper_placement = "floating"

    [shell.screen_corners]
    enabled = false
    size = 12

    [shell.session]
    grid = false
    grid_columns = 2

    [shell.shadow]
    alpha = 0.0

[system.monitor]
enabled = false

[theme]
builtin = "Nord"
community_palette = "Nord Aurora"
mode = "light"
pure_black_dark = false
shell_mode = "dark"
source = "wallpaper"
sync_color_scheme = true
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "gtk3", "gtk4", "hyprland", "niri", "qt" ]
    community_ids = [
        "brave-origin",
        "zen-browser",
        "lazyvim",
        "neovim",
        "obsidian",
        "vscode",
        "heroiclauncher",
        "fastfetch",
        "hyprtoolkit",
        "papirus-icons"
    ]

[wallpaper]
directory = "/home/mosesp/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/mosesp/Pictures/Wallpapers/beach_landscape.png"

    [wallpaper.last]
    path = "/home/mosesp/Pictures/Wallpapers/beach_landscape.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/mosesp/Pictures/Wallpapers/beach_landscape.png"

[widget.battery]
display_mode = "glyph"

    [widget.battery.actions]
    right = "exec auto-cpufreq-gtk"

[widget.bluetooth]
hide_when_adapter_off = true

[widget.brightness]
enabled = false

[widget.launcher]
glyph = "assembly-filled"

[widget.media]
hide_when_no_media = true
show_progress = true

[widget.workspaces]
label_source = "id"
style = "focus_hint"